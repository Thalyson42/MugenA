name: Android

# Android port (docs/android-port). Debug APK, arm64-v8a only (D-001).
on:
  push:
    branches: [main, 'android/**']
  pull_request:
  workflow_dispatch:

jobs:
  apk-debug:
    name: APK debug (arm64-v8a)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Host tests of the platform layer (P3a)
        run: |
          # Real timer.c/log.c/file.c + src/platform/*.c on the runner (Linux): path resolution, data dir, log, pacing.
          cmake -S tests/platform -B build/platform-tests -G Ninja
          cmake --build build/platform-tests
          ctest --test-dir build/platform-tests --output-on-failure

      - name: Android SDK components (NDK r27 LTS, CMake 3.22.1)
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;27.2.12479018" "cmake;3.22.1" "platforms;android-35"

      - name: assembleDebug
        working-directory: android
        run: ./gradlew --no-daemon assembleDebug

      - name: Print the APK signing certificate (fixed debug key, D-016)
        run: |
          apk=$(ls android/app/build/outputs/apk/debug/*.apk)
          apksigner=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          "$apksigner" verify --print-certs "$apk" | tee build/apk-certs.txt
          # the certificate must be the one of android/debug.keystore; if it changes, the app cannot be updated in place
          want=$(keytool -list -v -keystore android/debug.keystore -storepass android 2>/dev/null | sed -n 's/^[[:space:]]*SHA256:[[:space:]]*//p' | tr -d ':' | tr 'A-F' 'a-f')
          got=$(sed -n 's/.*certificate SHA-256 digest: *//p' build/apk-certs.txt | head -1)
          echo "keystore SHA-256: $want"
          echo "APK SHA-256:      $got"
          test -n "$want" && test "$want" = "$got"

      - name: Check that the APK carries arm64-v8a only
        run: |
          apk=$(ls android/app/build/outputs/apk/debug/*.apk)
          unzip -l "$apk" | grep -E 'lib/.*/libmugen\.so'
          test "$(unzip -l "$apk" | grep -c 'lib/arm64-v8a/libmugen.so')" = 1
          test "$(unzip -l "$apk" | grep -E 'lib/' | grep -vc 'lib/arm64-v8a/')" = 0

      - name: Check that the engine sources were compiled (mugen_core, P2)
        run: |
          # AGP hides the ninja output, so count the object files: the 81 src/*.c of mugen_core (the platform layer is the
          # static library mugen_platform since P3a).
          n=$(find android/app/.cxx -path '*mugen_core.dir*' -name '*.o' | wc -l)
          echo "mugen_core objects: $n"
          find android/app/.cxx -path '*mugen_core.dir*' -name '*.o' | sort | head -3
          test "$n" -ge 81

      - name: Check that libmugen.so carries the platform layer and the P3a engine subset
        run: |
          # The JNI entry points are in the dynamic symbol table (also in the stripped copy inside the APK).
          so=$(find android/app/build -path '*arm64-v8a*' -name libmugen.so | head -1)
          test -n "$so"
          for f in initPlatform platformSelfTest testError setStartMode; do
            nm -D --defined-only "$so" | grep -E " T Java_io_github_thalyson42_mugen_Native_$f\$"
          done
          # The engine's own functions are local symbols: only the unstripped copy under .cxx has them (informational).
          full=$(find android/app/.cxx android/app/build/intermediates/cxx -path '*arm64-v8a*' -name libmugen.so 2>/dev/null | head -1)
          echo "unstripped copy: $full"
          test -z "$full" || nm "$full" | grep -E ' [Tt] (Mugen_fopen|Mugen_ResolvePath|Timer_WaitFrame|Log_Init|File_Find|Mugen_EngineMain|Mugen_SdlProbeMain|System_Init|Mix_QuerySpecEx)$' | sort -u || true

      - name: Check the SDL stack in the APK (P3b M1a/M1b)
        run: |
          apk=$(ls android/app/build/outputs/apk/debug/*.apk)
          # the three native libraries side by side: libSDL2.so (SDL2), libSDL.so (sdl12-compat), libmugen.so
          for l in libSDL2.so libSDL.so libmugen.so; do
            test "$(unzip -l "$apk" | grep -c "lib/arm64-v8a/$l")" = 1
          done
          # the Java side of SDL2 is in the dex files
          mkdir -p build/apkdex && unzip -o -q "$apk" 'classes*.dex' -d build/apkdex
          cat build/apkdex/classes*.dex | grep -a -c 'Lorg/libsdl/app/SDLActivity;'
          cat build/apkdex/classes*.dex | grep -a -c 'Lio/github/thalyson42/mugen/MugenActivity;'
          # libmugen.so exports SDL_main (what SDLActivity looks up) and needs both SDL libraries; the compat library must
          # NOT link libSDL2.so (it finds it with dlopen, under the patched name)
          so=$(find android/app/build -path '*arm64-v8a*' -name libmugen.so | head -1)
          nm -D --defined-only "$so" | grep -E ' T SDL_main$'
          # M1b: libmugen.so links libSDL.so (the SDL 1.2 API) and NOT libSDL2.so: both export the same SDL_* names, and the
          # first NEEDED wins the binding (D-015, item 5 amended). The SDL 1.2 calls of the test are undefined in libmugen.so
          # and defined in libSDL.so.
          readelf -d "$so" | grep -E 'NEEDED.*libSDL\.so'
          if readelf -d "$so" | grep -q 'NEEDED.*libSDL2'; then echo 'libmugen.so must not link libSDL2.so'; exit 1; fi
          for f in SDL_Init SDL_SetVideoMode SDL_Flip SDL_UpperBlit SDL_MapRGB SDL_PollEvent; do
            nm -D --undefined-only "$so" | grep -E " U $f\$"
          done
          compat=$(find android/app/build -path '*arm64-v8a*' -name libSDL.so | head -1)
          readelf -d "$compat" | grep NEEDED
          for f in SDL_SetVideoMode SDL_Flip; do nm -D --defined-only "$compat" | grep -E " T $f\$"; done
          if readelf -d "$compat" | grep -q 'NEEDED.*libSDL2'; then echo 'libSDL.so must not link libSDL2.so'; exit 1; fi
          strings -a "$compat" | grep -x 'libSDL2.so'
          if strings -a "$compat" | grep -q 'libSDL2-2.0.so.0'; then echo 'unpatched dlopen name in libSDL.so'; exit 1; fi

      - uses: actions/upload-artifact@v4
        with:
          name: mugen-unleashed-android-debug
          path: android/app/build/outputs/apk/debug/*.apk
