name: Android

# Android port (docs/android-port). Debug APK, arm64-v8a only (D-001).
on:
  push:
    branches: [main, 'android/**']
  pull_request:
  workflow_dispatch:

jobs:
  apk-debug:
    name: APK debug (arm64-v8a)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Android SDK components (NDK r27 LTS, CMake 3.22.1)
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;27.2.12479018" "cmake;3.22.1" "platforms;android-35"

      - name: assembleDebug
        working-directory: android
        run: ./gradlew --no-daemon assembleDebug

      - name: Check that the APK carries arm64-v8a only
        run: |
          apk=$(ls android/app/build/outputs/apk/debug/*.apk)
          unzip -l "$apk" | grep -E 'lib/.*/libmugen\.so'
          test "$(unzip -l "$apk" | grep -c 'lib/arm64-v8a/libmugen.so')" = 1
          test "$(unzip -l "$apk" | grep -E 'lib/' | grep -vc 'lib/arm64-v8a/')" = 0

      - name: Check that the engine sources were compiled (mugen_core, P2)
        run: |
          # AGP hides the ninja output, so count the object files: 81 src/*.c + platform_posix.c.
          n=$(find android/app/.cxx -path '*mugen_core.dir*' -name '*.o' | wc -l)
          echo "mugen_core objects: $n"
          find android/app/.cxx -path '*mugen_core.dir*' -name '*.o' | sort | head -3
          test "$n" -ge 82

      - uses: actions/upload-artifact@v4
        with:
          name: mugen-unleashed-android-debug
          path: android/app/build/outputs/apk/debug/*.apk
